<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>Athkar Car Mode</title>
    <link rel="stylesheet" href="car.css">
    <link rel="stylesheet" href="player.css">
</head>
<body>
    <header class="car-header">
        <nav class="car-tabs">
            <button class="tab-btn" data-target="morning" aria-label="Morning Prayers">أذكار الصباح</button>
            <button class="tab-btn" data-target="evening" aria-label="Evening Prayers">أذكار المساء</button>
            <button class="tab-btn" data-target="travel" aria-label="Travel Prayer">دعاء السفر</button>
        </nav>
        <a href="index.html" class="exit-car-btn" aria-label="Exit Car Mode">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </a>
    </header>

    <main class="car-content">
        <!-- Morning Section -->
        <section id="morning" class="tab-panel">
            <div class="prayer-text-container" id="morning-text"></div>
            <div class="audio-controls">
                <button class="speed-btn" data-track="1" aria-label="Change Speed">1x</button>
                <button class="skip-btn prev-btn" data-track="1" aria-label="رجوع ١٠ ثوانٍ"><span aria-hidden="true">−10</span>
                </button>
                <button class="play-pause-btn" data-track="1" aria-label="Play/Pause">
                    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="skip-btn next-btn" data-track="1" aria-label="تقديم ١٠ ثوانٍ"><span aria-hidden="true">+10</span>
                </button>
            </div>
            <div class="progress-bar-container">
                <input class="progress-bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="موضع التشغيل" disabled>
                <div class="time-readout"><span class="current-time">0:00</span> / <span class="duration">0:00</span></div>
            </div>
            <audio id="audio-1" preload="none" src="assets/audio/track2.mp3"></audio> <!-- Morning is track2 -->
        </section>

        <!-- Evening Section -->
        <section id="evening" class="tab-panel">
            <div class="prayer-text-container" id="evening-text"></div>
            <div class="audio-controls">
                <button class="speed-btn" data-track="2" aria-label="Change Speed">1x</button>
                <button class="skip-btn prev-btn" data-track="2" aria-label="رجوع ١٠ ثوانٍ"><span aria-hidden="true">−10</span>
                </button>
                <button class="play-pause-btn" data-track="2" aria-label="Play/Pause">
                    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="skip-btn next-btn" data-track="2" aria-label="تقديم ١٠ ثوانٍ"><span aria-hidden="true">+10</span>
                </button>
            </div>
            <div class="progress-bar-container">
                <input class="progress-bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="موضع التشغيل" disabled>
                <div class="time-readout"><span class="current-time">0:00</span> / <span class="duration">0:00</span></div>
            </div>
            <audio id="audio-2" preload="none" src="assets/audio/track3.mp3"></audio> <!-- Evening is track3 -->
        </section>

        <!-- Travel Section -->
        <section id="travel" class="tab-panel">
            <div class="prayer-text-container" id="travel-text"></div>
            <div class="audio-controls">
                <button class="speed-btn" data-track="0" aria-label="Change Speed">1x</button>
                <button class="skip-btn prev-btn" data-track="0" aria-label="رجوع ١٠ ثوانٍ"><span aria-hidden="true">−10</span>
                </button>
                <button class="play-pause-btn" data-track="0" aria-label="Play/Pause">
                    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="skip-btn next-btn" data-track="0" aria-label="تقديم ١٠ ثوانٍ"><span aria-hidden="true">+10</span>
                </button>
            </div>
            <div class="progress-bar-container">
                <input class="progress-bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="موضع التشغيل" disabled>
                <div class="time-readout"><span class="current-time">0:00</span> / <span class="duration">0:00</span></div>
            </div>
            <audio id="audio-0" preload="none" src="assets/audio/track1.mp3"></audio> <!-- Travel is track1 -->
        </section>
    </main>
    <script src="shared.js"></script>
    <script src="player.js"></script>
</body>
</html>
